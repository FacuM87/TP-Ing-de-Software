name: Mantener app de Streamlit activa

on:
  schedule:
    - cron: "0 */10 * * *"   
  workflow_dispatch:          

permissions:
  contents: write             

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Commit vacío para evitar la hibernación
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "keep-alive Streamlit"
          git push